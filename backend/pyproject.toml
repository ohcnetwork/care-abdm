[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abdm"
version = "0.1.0"
description = "ABDM (HIE-CM v3) plug for CARE, built from abdm-docs.dev.eka.care"
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
authors = [{ name = "Open Healthcare Network", email = "support@ohc.network" }]
dependencies = [
    "django",
    "djangorestframework",
    "requests",
    "celery",
    "pydantic",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abdm = ["templates/**/*", "static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
